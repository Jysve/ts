[package]
name = "ts"
version = "0.1.0"
edition = "2024"
description = "An interactive terminal todo list organized by date and priority"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
toml = "0.8"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
